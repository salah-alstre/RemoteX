[package]
name = "remotex-elevate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol and helpers for RemoteX elevated (administrator) control through the Windows service"

[dependencies]
postcard.workspace = true
remotex-common = { version = "0.1.0", path = "../common" }
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }
