[package]
name = "remotex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RemoteX desktop application"
build = "build.rs"

[lib]
name = "remotex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "remotex"
path = "src/main.rs"

[features]
# Local-server override, isolated data dir and multi-instance for developers. Never enabled for installers.
dev-tools = []

[dependencies]
remotex-common = { version = "0.1.0", path = "../../../crates/common" }
remotex-input = { version = "0.1.0", path = "../../../crates/input" }
remotex-security = { version = "0.1.0", path = "../../../crates/security" }
remotex-session = { version = "0.1.0", path = "../../../crates/session" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
